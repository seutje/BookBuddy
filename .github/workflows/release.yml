name: Publish Windows release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify release tag and versions
        id: version
        run: |
          node --test scripts/check-release-version.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-release-version.mjs "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$($env:GITHUB_REF_NAME.Substring(1))" | Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_OUTPUT

      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run formatting, static checks and public tests
        run: npm run check

      - name: Build NSIS installer
        run: |
          . ./scripts/windows-toolchain.ps1
          npm run tauri -- build --ci --bundles nsis -- --locked

      - name: Calculate installer checksum
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/nsis/BookBuddy_${version}_x64-setup.exe"
          if ($installer.PSIsContainer) { throw 'Expected a Windows installer file.' }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding ascii -LiteralPath "$($installer.FullName).sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/BookBuddy_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/BookBuddy_${{ steps.version.outputs.version }}_x64-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish installer to GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: release

      - name: Create release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "BookBuddy $RELEASE_TAG" \
            --generate-notes \
            --notes "Windows x64 installer and SHA-256 checksum. The installer is unsigned and requires an existing Microsoft Edge WebView2 Runtime."
