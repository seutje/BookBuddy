name: Publish Windows release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Find an unpublished release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test release selection
        run: node --test scripts/*.test.mjs
      - name: Resolve the existing version tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release.mjs

  build:
    name: Check and build Windows x64 installer
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify release tag and versions
        id: version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node --test scripts/check-release-version.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-release-version.mjs "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$($env:RELEASE_TAG.Substring(1))" | Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_OUTPUT

      - name: Verify dedicated updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the dedicated BookBuddy TAURI_SIGNING_PRIVATE_KEY repository secret before releasing.' }

      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run formatting, static checks and public tests
        run: npm run check

      - name: Build NSIS installer
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the dedicated BookBuddy TAURI_SIGNING_PRIVATE_KEY repository secret before releasing.' }
          . ./scripts/windows-toolchain.ps1
          npm run tauri -- build --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/create-updater-manifest.mjs "$env:RELEASE_TAG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}

      - name: Calculate installer checksum
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/nsis/BookBuddy_${version}_x64-setup.exe"
          if ($installer.PSIsContainer) { throw 'Expected a Windows installer file.' }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding ascii -LiteralPath "$($installer.FullName).sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/BookBuddy_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/BookBuddy_${{ steps.version.outputs.version }}_x64-setup.exe.sha256
            src-tauri/target/release/bundle/nsis/BookBuddy_${{ steps.version.outputs.version }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish installer to GitHub Releases
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: release

      - name: Create release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # A simultaneous tag/main push may have published while this build ran.
          status=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.draft' 2>release-lookup.log) || {
            if ! grep -q 'HTTP 404' release-lookup.log; then cat release-lookup.log >&2; exit 1; fi
            status=missing
          }
          if [ "$status" = false ]; then
            echo "Release $RELEASE_TAG is already published; keeping its assets."
            exit 0
          fi
          if [ "$status" = true ]; then
            gh release upload "$RELEASE_TAG" release/* --repo "$GH_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "BookBuddy $RELEASE_TAG" \
            --generate-notes \
            --notes "Windows x64 installer, SHA-256 checksum and signed updater feed. Update signatures verify BookBuddy releases; the installer lacks an Authenticode publisher certificate and requires an existing Microsoft Edge WebView2 Runtime."
