[package]
name = "bookbuddy"
version = "0.1.2"
description = "Offline household book tracker"
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "bookbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
libsqlite3-sys = "=0.30.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }
calamine = { version = "0.31", features = ["dates"] }
tauri-plugin-dialog = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
tempfile = "3"
tauri-plugin-updater = "=2.13.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
